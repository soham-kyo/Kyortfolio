<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Soham Patil — soham.kyo</title>
  <desc id="d">Animated banner: floating glass plates, a glowing orb and flashes of lightning, with rotating roles: Websites, AI / ML projects, Flutter apps, Android apps.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0a1c"/>
      <stop offset="1" stop-color="#05040a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#8064ff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#8064ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c5b4ff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#8064ff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="plate3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1530"/>
      <stop offset="1" stop-color="#07050c"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#e4dcff"/>
      <stop offset="0.6" stop-color="#8064ff"/>
      <stop offset="1" stop-color="#2a1b66"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c5b4ff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#c5b4ff"/>
      <stop offset="0.7" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f0ff"/>
      <stop offset="1" stop-color="#c5b4ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#c5b4ff" stroke-opacity="0.06"/>
    </pattern>
    <filter id="glowf" x="-60%" y="-30%" width="220%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="380" rx="26"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .f1 { animation: float 7s ease-in-out infinite; }
    .f2 { animation: float 9s ease-in-out -3s infinite; }
    .f3 { animation: float 6s ease-in-out -1.5s infinite; }
    .orb { transform-box: fill-box; transform-origin: center; animation: pulse 4.5s ease-in-out infinite; }
    .halo { animation: halo 4.5s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    @keyframes halo { 0%,100% { opacity: .45; } 50% { opacity: .9; } }
    .b1 { opacity: 0; animation: flash 11s infinite; }
    .b2 { opacity: 0; animation: flash 17s 5s infinite; }
    @keyframes flash {
      0%,91%,93%,100% { opacity: 0; }
      91.2% { opacity: .75; } 91.5% { opacity: .05; }
      92% { opacity: 1; } 92.4% { opacity: 0; }
    }
    .role { opacity: 0; animation: role 12s infinite; }
    .r2 { animation-delay: 3s; } .r3 { animation-delay: 6s; } .r4 { animation-delay: 9s; }
    @keyframes role {
      0% { opacity: 0; transform: translateY(10px); }
      3%, 22% { opacity: 1; transform: translateY(0); }
      25%, 100% { opacity: 0; transform: translateY(-10px); }
    }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .r1 { opacity: 1; }
      .b1, .b2 { opacity: 0; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <rect width="1200" height="380" fill="url(#glow)"/>

    <!-- lightning (same storm as the site's dark theme) -->
    <g class="b1" filter="url(#glowf)" transform="translate(985 -6) rotate(16)">
      <polygon fill="url(#bolt)" points="30.8,0 70,0 38.5,62.4 57.4,62.4 0,166.4 25.2,101.4 11.9,101.4"/>
    </g>
    <g class="b2" filter="url(#glowf)" transform="translate(805 14) rotate(-13) scale(0.7)">
      <polygon fill="url(#bolt)" points="30.8,0 70,0 38.5,62.4 57.4,62.4 0,166.4 25.2,101.4 11.9,101.4"/>
    </g>

    <!-- floating glass plates -->
    <g transform="translate(940 196)">
      <g class="f1"><rect x="-120" y="-120" width="240" height="240" rx="26" transform="rotate(-8)" fill="url(#plate)" stroke="#c5b4ff" stroke-opacity="0.35"/></g>
      <g class="f2"><rect x="-120" y="-120" width="240" height="240" rx="26" transform="translate(18 12) rotate(6)" fill="url(#plate)" stroke="#c5b4ff" stroke-opacity="0.4"/></g>
      <g class="f3">
        <g transform="translate(34 24) rotate(-2)">
          <rect x="-120" y="-120" width="240" height="240" rx="26" fill="url(#plate3)" stroke="#c5b4ff" stroke-opacity="0.5"/>
          <rect x="-84" y="-52" width="168" height="12" rx="6" fill="#c5b4ff" fill-opacity="0.38"/>
          <rect x="-84" y="-18" width="118" height="12" rx="6" fill="#ffffff" fill-opacity="0.16"/>
          <rect x="-84" y="16" width="76" height="12" rx="6" fill="#c5b4ff" fill-opacity="0.38"/>
          <rect x="-84" y="50" width="140" height="12" rx="6" fill="#ffffff" fill-opacity="0.10"/>
        </g>
      </g>
    </g>

    <!-- orb -->
    <circle class="halo" cx="1062" cy="296" r="60" fill="#8064ff" filter="url(#soft)"/>
    <circle class="orb" cx="1062" cy="296" r="40" fill="url(#orb)"/>

    <!-- text -->
    <text class="mono" x="70" y="96" font-size="17" fill="#a49bb9">soham@kyo:~$ <tspan fill="#c5b4ff">whoami</tspan></text>
    <text class="sans" x="68" y="182" font-size="78" font-weight="700" letter-spacing="-3" fill="url(#name)">Soham <tspan fill="#c5b4ff">Patil</tspan></text>

    <text class="mono" x="70" y="238" font-size="28" fill="#f4f0ff">I build</text>
    <g class="mono" font-size="28" font-weight="700" fill="#c5b4ff">
      <text class="role r1" x="204" y="238">Websites</text>
      <text class="role r2" x="204" y="238">AI / ML projects</text>
      <text class="role r3" x="204" y="238">Flutter apps</text>
      <text class="role r4" x="204" y="238">Android apps</text>
    </g>

    <text class="sans" x="70" y="292" font-size="17" fill="#a49bb9">Curious by nature, driven by ideas, always learning by building.</text>
    <rect class="cur" x="70" y="318" width="11" height="20" fill="#c5b4ff"/>
    <text class="mono" x="92" y="334" font-size="15" fill="#6f6785">soham.kyo  ·  Computer Science &amp; Engineering  ·  Latur, India</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="26" fill="none" stroke="#c5b4ff" stroke-opacity="0.22"/>
</svg>
